[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cctv-search"
version = "0.1.0"
description = "CCTV event search system - video to detections, tracks, zone events, SQLite index, and search."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "CCTV Search Team" }
]
dependencies = [
    "ultralytics>=8.3.0,<9.0.0",
    "opencv-python>=4.8.0,<5.0.0",
    "numpy>=1.26.0,<3.0.0",
    "pandas>=2.0.0,<3.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "streamlit>=1.30.0,<2.0.0",
    "imageio-ffmpeg>=0.4.9,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0,<9.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
